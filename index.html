<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meteo Vento & Bussola Giroscopica</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .compass-dial, .wind-arrow {
      transition: transform 0.15s linear;
      will-change: transform;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 select-none">

  <main class="w-full max-w-md bg-slate-800 rounded-3xl shadow-2xl p-6 border border-slate-700">
    <header class="text-center mb-4">
      <h1 class="text-2xl font-black text-sky-400 uppercase tracking-wide">Meteo & Bussola</h1>
      <p id="location-text" class="text-xs text-slate-400 mt-1">Rilevamento posizione in corso...</p>
    </header>

    <!-- Pulsante Attivazione Giroscopio (Sempre visibile all'inizio per sbloccare i sensori) -->
    <button id="enable-gyro-btn" onclick="startSensors()" class="w-full mb-4 bg-sky-500 hover:bg-sky-400 text-slate-900 font-bold py-2.5 px-4 rounded-xl shadow-lg transition text-sm flex items-center justify-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
      Attiva Bussola / Giroscopio
    </button>

    <!-- Visualizzatore Bussola e Vento -->
    <div class="relative w-64 h-64 mx-auto mb-6 flex items-center justify-center overflow-hidden rounded-full border-2 border-slate-700/50 bg-slate-900/50 shadow-inner">
      
      <!-- Quadrante Bussola -->
      <div id="compass-dial" class="compass-dial absolute inset-0 rounded-full flex items-center justify-center">
        <span class="absolute top-3 text-red-500 font-black text-base">N</span>
        <span class="absolute right-3 text-slate-400 font-bold text-base">E</span>
        <span class="absolute bottom-3 text-slate-400 font-bold text-base">S</span>
        <span class="absolute left-3 text-slate-400 font-bold text-base">O</span>
        <!-- Tacco Nord -->
        <div class="absolute top-1 w-1 h-2 bg-red-500 rounded-full"></div>
      </div>

      <!-- Freccia del Vento (Azzurra) -->
      <div id="wind-arrow-wrapper" class="wind-arrow absolute w-full h-full flex items-center justify-center pointer-events-none">
        <div class="flex flex-col items-center -translate-y-20">
          <svg class="w-8 h-8 text-sky-400 drop-shadow-[0_0_10px_rgba(56,189,248,0.8)]" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 3l-8 18 8-4 8 4z" />
          </svg>
          <span class="text-[10px] font-black tracking-wider uppercase text-sky-300 bg-slate-900/90 px-1.5 py-0.5 rounded border border-sky-500/30 mt-0.5">Vento</span>
        </div>
      </div>

      <!-- Indicatore Centro Telefono -->
      <div class="z-10 w-3 h-3 bg-red-500 rounded-full border-2 border-white shadow-md"></div>
    </div>

    <!-- Dati Meteo Griglia -->
    <div class="grid grid-cols-2 gap-3 text-center">
      <div class="bg-slate-700/40 p-3 rounded-2xl border border-slate-700">
        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Temperatura</span>
        <span id="temp-val" class="text-xl font-extrabold text-amber-400">-- °C</span>
      </div>
      <div class="bg-slate-700/40 p-3 rounded-2xl border border-slate-700">
        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Pioggia</span>
        <span id="rain-val" class="text-xl font-extrabold text-blue-400">-- mm</span>
      </div>
      <div class="bg-slate-700/40 p-3 rounded-2xl border border-slate-700">
        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Velocità Vento</span>
        <span id="wind-speed-val" class="text-xl font-extrabold text-emerald-400">-- km/h</span>
      </div>
      <div class="bg-slate-700/40 p-3 rounded-2xl border border-slate-700">
        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Direzione Vento</span>
        <span id="wind-dir-val" class="text-xl font-extrabold text-sky-400">--°</span>
      </div>
    </div>

    <p id="orientation-info" class="text-[11px] text-center text-slate-400 mt-4 leading-tight">
      Tieni il telefono orizzontale. Se la bussola non ruota, premi "Attiva Bussola".
    </p>
  </main>

  <script>
    let windDirectionDegrees = 0; 
    let deviceHeading = 0;        

    window.addEventListener('load', () => {
      // 1. GPS & Meteo
      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            document.getElementById('location-text').textContent = `Coordinate: ${lat.toFixed(2)}°, ${lon.toFixed(2)}°`;
            await fetchWeatherData(lat, lon);
          },
          () => {
            document.getElementById('location-text').textContent = 'GPS non disponibile. Uso dati standard.';
            fetchWeatherData(41.90, 12.49); // Fallback Roma
          }
        );
      }
    });

    async function fetchWeatherData(lat, lon) {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,precipitation,wind_speed_10m,wind_direction_10m`;
        const res = await fetch(url);
        const data = await res.json();
        
        const current = data.current;
        windDirectionDegrees = current.wind_direction_10m;

        document.getElementById('temp-val').textContent = `${current.temperature_2m} °C`;
        document.getElementById('rain-val').textContent = `${current.precipitation} mm`;
        document.getElementById('wind-speed-val').textContent = `${current.wind_speed_10m} km/h`;
        document.getElementById('wind-dir-val').textContent = `${windDirectionDegrees}°`;

        updateCompassUI();
      } catch (err) {
        console.error("Errore API Meteo:", err);
      }
    }

    // Attivazione Manuale Sensori per sbloccare le restrizioni dei browser mobile
    function startSensors() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        // iOS Safari
        DeviceOrientationEvent.requestPermission()
          .then(response => {
            if (response === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation, true);
              document.getElementById('enable-gyro-btn').classList.add('hidden');
            } else {
              alert("Permesso negato per i sensori.");
            }
          })
          .catch(console.error);
      } else {
        // Android / Altri Browser
        if ('ondeviceorientationabsolute' in window) {
          window.addEventListener('deviceorientationabsolute', handleOrientation, true);
        } else {
          window.addEventListener('deviceorientation', handleOrientation, true);
        }
        document.getElementById('enable-gyro-btn').classList.add('hidden');
      }
    }

    function handleOrientation(event) {
      let heading = null;

      if (event.webkitCompassHeading) {
        // iOS
        heading = event.webkitCompassHeading;
      } else if (event.alpha !== null) {
        // Android (Calcolo relativo al Nord magnetico)
        heading = 360 - event.alpha;
      }

      if (heading !== null) {
        deviceHeading = heading;
        updateCompassUI();
      }
    }

    function updateCompassUI() {
      const compassDial = document.getElementById('compass-dial');
      const windArrow = document.getElementById('wind-arrow-wrapper');

      // Ruota il quadrante della bussola
      compassDial.style.transform = `rotate(${-deviceHeading}deg)`;

      // Calcola l'angolo relativo per la freccia del vento
      const relativeWindAngle = windDirectionDegrees - deviceHeading;
      windArrow.style.transform = `rotate(${relativeWindAngle}deg)`;
    }
  </script>
</body>
</html>
